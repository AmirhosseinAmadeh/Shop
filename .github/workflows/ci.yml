name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile
        run: |
          mkdir out
          javac -Xlint:all -d out $(find src -name '*.java')
          cp -r src/main/resources/* out/
      - name: Test
        run: java -cp out shop.ShopTests
